<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="60%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Pulse Neon Gradient -->
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#60a5fa"/>
      <stop offset="85%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Subtle Ambient Halo -->
  <circle cx="32" cy="32" r="19" fill="#0284c7" opacity="0.18" filter="url(#glow)"/>

  <!-- Pulse Wave Heartbeat Track (Soft background guide) -->
  <path d="M 8 33 H 19 L 24 23 L 30 43 L 37 17 L 43 38 L 48 33 H 56" 
        stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>

  <!-- High-Energy Glowing Pulse Wave Line -->
  <path d="M 9 33 H 19 L 24 22 L 30 43 L 37 16 L 43 38 L 48 33 H 55" 
        stroke="url(#neonPulse)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Core Pulse Foreground Crisp Line -->
  <path d="M 9 33 H 19 L 24 22 L 30 43 L 37 16 L 43 38 L 48 33 H 55" 
        stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Peak AI Sparkle Star atop the highest vertex (37, 16) -->
  <g transform="translate(37, 16) scale(0.9)">
    <!-- 4-point AI Diamond Star -->
    <path d="M 0 -7 Q 1 -1 7 0 Q 1 1 0 7 Q -1 1 -7 0 Q -1 -1 0 -7 Z" fill="url(#sparkleGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Accent Radar Ring Signal / Broadcast Indicator -->
  <circle cx="49" cy="15" r="2" fill="#22d3ee" opacity="0.8"/>
  <circle cx="53" cy="11" r="1.2" fill="#818cf8" opacity="0.7"/>
</svg>
